name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Neuere Pushes auf denselben Branch brechen laufende Runs ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    env:
      # In CI wird nie eine Electron-App gestartet, nur gebaut. Das spart den
      # ~100 MB Binary-Download und macht den Lauf schneller/stabiler.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Falls doch eine Postinstall-Kette anspringt: keinen Prompt blockieren.
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      # Die geteilten Pakete (@avplan/inventory-core, onboarding-core, ui)
      # muessen zuerst nach dist/ gebaut sein — Apps und Tests importieren sie.
      - name: Build shared packages
        run: npm run build:packages

      - name: Lint
        run: npm run lint --workspaces --if-present

      # tsc -b in den App-Build-Skripten uebernimmt den Typecheck.
      - name: Build (typecheck + bundle)
        run: npm run build --workspaces --if-present

      - name: Test
        run: npm run test --workspaces --if-present

      - name: Herkunfts-Vokabular (beide Planer-Kopien)
        run: npm run spec:vocab

      - name: Vendorte Features haben einen Bedienweg
        run: npm run features:reachable

      - name: Keine nativen Browser-Dialoge
        run: npm run dialogs:native

      # Braucht keinen Upstream-Checkout und laeuft deshalb hier statt im
      # Drift-Job: der ueberspringt sich, wenn die Nachbar-Repos fehlen.
      - name: Vendorte Apps tragen die Lizenz der Suite
        run: npm run licence:check

      # Am 2026-09-04 war KEINES der 67 Dokumente unter docs/ von einer
      # Einstiegsseite aus verlinkt -- auch nicht IMPLEMENTATION_STATUS und
      # IMPLEMENTATION_BACKLOG. Ein Dokument, das nur findet, wer den Ordner
      # durchblaettert, ist praktisch nicht vorhanden.
      - name: Dokumentation ist auffindbar
        run: npm run docs:reachable

  # ---------------------------------------------------------------------------
  # Drift-Guard fuer die vendorten Planer-Kopien unter apps/.
  #
  # Die Suite enthaelt Kopien der drei Planer statt sie zu konsumieren, und
  # diese Kopien sind bereits in beide Richtungen auseinandergelaufen (siehe
  # docs/research/repos/INVENTORY.md). Bis die Konsolidierung durch ist,
  # verhindert dieser Job wenigstens, dass die Divergenz weiter waechst.
  #
  # Die Upstream-Checkouts brauchen Lesezugriff auf die Nachbar-Repos. Ist der
  # nicht da, ueberspringt das Skript die Pruefung und der Job bleibt gruen —
  # der Guard soll nie fremde PRs blockieren, nur echtes Driftwachstum melden.
  # ---------------------------------------------------------------------------
  planner-drift:
    name: Planner drift guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout suite
        uses: actions/checkout@v4
        with:
          path: suite

      - name: Checkout cable-planner
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: larszu/cable-planner
          path: upstream/cable-planner
          # Volle Historie, nicht der Default depth:1. Die zweite Frage des
          # Guards ("was hat sich upstream seit der Baseline getan, das die
          # Suite nicht uebernommen hat") loest den Baseline-Sha im
          # Upstream-Klon auf. Im flachen Klon existiert dieser Commit nicht,
          # planner-drift.mjs meldet dann ehrlich "Stand nicht bekannt" — und
          # zwar in genau dem Fall, fuer den es die Pruefung gibt: bewegtem
          # Upstream. Ohne diese Zeile hat sie in CI keinen Weltzustand, in
          # dem sie etwas findet (nachgemessen 2026-09-04).
          fetch-depth: 0

      - name: Checkout multicam-planner
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: larszu/multicam-planner
          path: upstream/multicam-planner
          # Volle Historie, nicht der Default depth:1. Die zweite Frage des
          # Guards ("was hat sich upstream seit der Baseline getan, das die
          # Suite nicht uebernommen hat") loest den Baseline-Sha im
          # Upstream-Klon auf. Im flachen Klon existiert dieser Commit nicht,
          # planner-drift.mjs meldet dann ehrlich "Stand nicht bekannt" — und
          # zwar in genau dem Fall, fuer den es die Pruefung gibt: bewegtem
          # Upstream. Ohne diese Zeile hat sie in CI keinen Weltzustand, in
          # dem sie etwas findet (nachgemessen 2026-09-04).
          fetch-depth: 0

      - name: Checkout light-planner
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: larszu/light-planner
          path: upstream/light-planner
          # Volle Historie, nicht der Default depth:1. Die zweite Frage des
          # Guards ("was hat sich upstream seit der Baseline getan, das die
          # Suite nicht uebernommen hat") loest den Baseline-Sha im
          # Upstream-Klon auf. Im flachen Klon existiert dieser Commit nicht,
          # planner-drift.mjs meldet dann ehrlich "Stand nicht bekannt" — und
          # zwar in genau dem Fall, fuer den es die Pruefung gibt: bewegtem
          # Upstream. Ohne diese Zeile hat sie in CI keinen Weltzustand, in
          # dem sie etwas findet (nachgemessen 2026-09-04).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check drift against baseline
        working-directory: suite
        run: node scripts/planner-drift.mjs --upstream ../upstream --check

      - name: Write report
        if: always()
        working-directory: suite
        run: node scripts/planner-drift.mjs --upstream ../upstream --report drift-report.md || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-drift-report
          path: suite/drift-report.md
          if-no-files-found: ignore

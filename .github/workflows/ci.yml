name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Neuere Pushes auf denselben Branch brechen laufende Runs ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    env:
      # In CI wird nie eine Electron-App gestartet, nur gebaut. Das spart den
      # ~100 MB Binary-Download und macht den Lauf schneller/stabiler.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Falls doch eine Postinstall-Kette anspringt: keinen Prompt blockieren.
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci)
        run: npm ci

      # Die geteilten Pakete (@avplan/inventory-core, onboarding-core, ui)
      # muessen zuerst nach dist/ gebaut sein — Apps und Tests importieren sie.
      - name: Build shared packages
        run: npm run build:packages

      - name: Lint
        run: npm run lint --workspaces --if-present

      # tsc -b in den App-Build-Skripten uebernimmt den Typecheck.
      - name: Build (typecheck + bundle)
        run: npm run build --workspaces --if-present

      - name: Test
        run: npm run test --workspaces --if-present

      - name: Herkunfts-Vokabular (beide Planer-Kopien)
        run: npm run spec:vocab

      # Der Stand-Stempel (ADR-004) liegt in drei Kopien -- eine je Planer. Die
      # acht Hex-Zeichen darauf sind nur zum Vergleichen da; rechnen zwei Apps
      # sie verschieden, vergleicht jemand am Telefon zwei Zahlen, die nichts
      # miteinander zu tun haben. Dieser Lauf fuehrt alle drei aus und haelt
      # ihre Ergebnisse gegeneinander -- Verhalten, nicht Quelltext.
      - name: Stand-Stempel rechnet in allen drei Planern gleich
        run: npm run stamp:parity

      - name: Vendorte Features haben einen Bedienweg
        run: npm run features:reachable

      - name: Keine nativen Browser-Dialoge
        run: npm run dialogs:native

      # Braucht keinen Upstream-Checkout und laeuft deshalb hier statt im
      # Drift-Job: der ueberspringt sich, wenn die Nachbar-Repos fehlen.
      - name: Vendorte Apps tragen die Lizenz der Suite
        run: npm run licence:check

      # Am 2026-09-04 war KEINES der 67 Dokumente unter docs/ von einer
      # Einstiegsseite aus verlinkt -- auch nicht IMPLEMENTATION_STATUS und
      # IMPLEMENTATION_BACKLOG. Ein Dokument, das nur findet, wer den Ordner
      # durchblaettert, ist praktisch nicht vorhanden.
      - name: Dokumentation ist auffindbar
        run: npm run docs:reachable

      # Der Suite-Installer verpackt Cables Main-Prozess mit; was der zur
      # Laufzeit `require`t, muss in apps/shell/package.json stehen. Gemessen
      # 2026-09-05 fehlten `ws` und `@avplan/lexware-core` -- beides waere erst
      # beim Nutzer aufgefallen, im Log einer verschluckten Registrierung.
      - name: Suite-Paket enthaelt jede Laufzeit-Abhaengigkeit
        run: npm run deps:check

      # Der Tag v0.1.0 (Lauf 33970319571) hat NICHTS ans Release gehaengt: der
      # macOS-Universal-Merge brach an einer in beiden Teil-Builds identischen
      # Prebuild-Datei ab und riss ueber `needs: build` die fertige Windows-.exe
      # mit; ausserdem schrieben NSIS und Portable auf denselben Dateinamen, das
      # zweite Ziel ueberschrieb das erste. Beides ist vor dem Bauen
      # entscheidbar -- also wird es hier entschieden, nicht am naechsten Tag.
      - name: Release-Artefakte sind baubar und kollidieren nicht
        run: npm run release:check

      # Fragt die action.yml jedes Pins nach ihrer Node-Version, statt sie in
      # einem Kommentar zu behaupten. Am 2026-09-05 lief hier fast alles auf
      # node20 -- und der Kommentar in `release-suite.yml` gab dazu einen Stand
      # wieder, den es nicht mehr gab. Der Lauf folgt eine Ebene in
      # Composite-Actions hinein: `upload-pages-artifact@v3` (im cable-planner)
      # hatte node20 nur im Inneren, von aussen sah der Pin sauber aus.
      - name: Actions laufen auf einer unterstuetzten Node-Version
        run: npm run actions:check

      # Zuletzt und bewusst: dieser Lauf prueft, dass die Liste darueber
      # vollstaendig ist. In `light-planner` fehlte `mvr:check` genau so --
      # er existierte, war gruen, und lief bei keinem Merge.
      - name: Jeder Pruef-Lauf steht auch im Workflow
        run: npm run ci:complete

  # ---------------------------------------------------------------------------
  # Headless-Smoke: startet die GEBAUTE Suite und prueft, was sich nur an der
  # laufenden App pruefen laesst -- dass die `planner-*://`-Protokolle wirklich
  # Inhalt liefern und dass Cables IPC-Module registrieren UND ihre lazy
  # geladenen Pakete finden. Bis hierher hat zwischen `npm run build` und dem
  # Installer nichts die App je gestartet; genau in dieser Luecke lagen die
  # Release-Fehler dieser Woche.
  #
  # Eigener Job, weil er drei Dinge braucht, die der Haupt-Job nicht hat: das
  # Electron-Binary (der Haupt-Job setzt ELECTRON_SKIP_BINARY_DOWNLOAD), einen
  # X-Server und `libsecret` fuer keytar.
  # ---------------------------------------------------------------------------
  ui-smoke:
    name: Headless-Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libsecret-1-0 xvfb
      - run: npm ci
      - name: Build (Pakete, Shell, Planer)
        run: |
          npm run build:packages
          npm run build --workspace @avplan/shell
          npm run build:planners
      - name: Headless-Smoke
        run: xvfb-run -a npm run ui:smoke
      - name: Screenshots bei Fehlschlag
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: suite-smoke-screenshots
          path: /tmp/av-planner-suite-shots
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Drift-Guard fuer die vendorten Planer-Kopien unter apps/.
  #
  # Die Suite enthaelt Kopien der drei Planer statt sie zu konsumieren, und
  # diese Kopien sind bereits in beide Richtungen auseinandergelaufen (siehe
  # docs/research/repos/INVENTORY.md). Bis die Konsolidierung durch ist,
  # verhindert dieser Job wenigstens, dass die Divergenz weiter waechst.
  #
  # Die Upstream-Checkouts brauchen Lesezugriff auf die Nachbar-Repos. Ist der
  # nicht da, ueberspringt das Skript die Pruefung und der Job bleibt gruen —
  # der Guard soll nie fremde PRs blockieren, nur echtes Driftwachstum melden.
  # ---------------------------------------------------------------------------
  planner-drift:
    name: Planner drift guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout suite
        uses: actions/checkout@v5
        with:
          path: suite

      - name: Checkout cable-planner
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: larszu/cable-planner
          path: upstream/cable-planner
          # Volle Historie, nicht der Default depth:1. Die zweite Frage des
          # Guards ("was hat sich upstream seit der Baseline getan, das die
          # Suite nicht uebernommen hat") loest den Baseline-Sha im
          # Upstream-Klon auf. Im flachen Klon existiert dieser Commit nicht,
          # planner-drift.mjs meldet dann ehrlich "Stand nicht bekannt" — und
          # zwar in genau dem Fall, fuer den es die Pruefung gibt: bewegtem
          # Upstream. Ohne diese Zeile hat sie in CI keinen Weltzustand, in
          # dem sie etwas findet (nachgemessen 2026-09-04).
          fetch-depth: 0

      - name: Checkout multicam-planner
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: larszu/multicam-planner
          path: upstream/multicam-planner
          # Volle Historie, nicht der Default depth:1. Die zweite Frage des
          # Guards ("was hat sich upstream seit der Baseline getan, das die
          # Suite nicht uebernommen hat") loest den Baseline-Sha im
          # Upstream-Klon auf. Im flachen Klon existiert dieser Commit nicht,
          # planner-drift.mjs meldet dann ehrlich "Stand nicht bekannt" — und
          # zwar in genau dem Fall, fuer den es die Pruefung gibt: bewegtem
          # Upstream. Ohne diese Zeile hat sie in CI keinen Weltzustand, in
          # dem sie etwas findet (nachgemessen 2026-09-04).
          fetch-depth: 0

      - name: Checkout light-planner
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: larszu/light-planner
          path: upstream/light-planner
          # Volle Historie, nicht der Default depth:1. Die zweite Frage des
          # Guards ("was hat sich upstream seit der Baseline getan, das die
          # Suite nicht uebernommen hat") loest den Baseline-Sha im
          # Upstream-Klon auf. Im flachen Klon existiert dieser Commit nicht,
          # planner-drift.mjs meldet dann ehrlich "Stand nicht bekannt" — und
          # zwar in genau dem Fall, fuer den es die Pruefung gibt: bewegtem
          # Upstream. Ohne diese Zeile hat sie in CI keinen Weltzustand, in
          # dem sie etwas findet (nachgemessen 2026-09-04).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check drift against baseline
        working-directory: suite
        run: node scripts/planner-drift.mjs --upstream ../upstream --check

      - name: Write report
        if: always()
        working-directory: suite
        run: node scripts/planner-drift.mjs --upstream ../upstream --report drift-report.md || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: planner-drift-report
          path: suite/drift-report.md
          if-no-files-found: ignore
